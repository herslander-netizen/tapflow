name: TapFlow — validação do protótipo
on:
  pull_request:
    branches: [main, 'feat/tapflow-integrado-preview-api']
    paths:
      - "apps/web/**"
      - "brand/**"
      - "docs/IDENTIDADE_VISUAL_TAPFLOW.md"
      - "apps/api/**"
      - "packages/contracts/**"
      - "tests/unit/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-demo.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe da interface
        run: |
          node --check apps/api/order-service.mjs
          node --check apps/web/app.js
          node --check apps/web/domain.mjs
          node --check apps/web/demo-data.js
          node --check apps/web/media.mjs
          node --check apps/web/theme.mjs
          node --check apps/web/theme-panel.mjs
          node --check scripts/serve.mjs
          node --check scripts/build-preview-worker.mjs
      - name: Testes unitários (sem dependências e sem deploy)
        run: npm test
      - name: Build da prévia (sem publicação)
        run: npm run build:preview
      - name: Verificar disponibilidade HTTP da prévia publicada
        run: |
          set -euo pipefail
          BASE="https://tapflow-aparencia-demo.tapflowse.workers.dev"
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors --max-time 25 "$BASE/__preview/status" -o status.json
          python3 - <<'PY'
          import json
          data=json.load(open("status.json"))
          assert data["product"]=="TapFlow"
          assert data["demo"] is True
          assert data["realPayments"] is False
          assert data["ordersEnabled"] is False
          print("Worker em funcionamento e sem pedidos/pagamentos reais.")
          PY
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors --max-time 25 "$BASE/" -o index.html
          grep -q "theme-panel.mjs" index.html
          grep -q "theme.css" index.html
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors --max-time 25 "$BASE/theme.mjs" -o theme.mjs
          grep -q THEME_PRESETS theme.mjs
