name: TapFlow — validar preparação Free
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/free-stack/**"
      - "tests/unit/free-infra.test.mjs"
      - "tests/unit/gemini.test.mjs"
      - "tests/unit/groq.test.mjs"
      - "tests/unit/ai-preview-route.test.mjs"
      - "tests/unit/evolution-alvo.test.mjs"
      - "tests/integration/preview-smoke.test.mjs"
      - ".github/workflows/tapflow-free-verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  free-safety-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe dos módulos
        run: |
          node --check infra/free-stack/worker.mjs
          node --check infra/free-stack/gemini.mjs
          node --check infra/free-stack/groq.mjs
          node --check infra/free-stack/ai-preview-route.mjs
          node --check infra/free-stack/evolution-alvo.mjs
      - name: Testar segurança, Gemini e Groq (sem credenciais)
        run: node --test tests/unit/free-infra.test.mjs tests/unit/gemini.test.mjs tests/unit/groq.test.mjs tests/unit/ai-preview-route.test.mjs tests/unit/evolution-alvo.test.mjs
      - name: Testar prévia pública e status D1 (somente leitura)
        run: node --test tests/integration/preview-smoke.test.mjs
      # Sem secrets, sem migrações, sem deploy, sem criar recursos, sem pagamentos.
